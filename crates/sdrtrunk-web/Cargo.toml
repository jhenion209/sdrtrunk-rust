[package]
name = "sdrtrunk-web"
description = "SDRTrunk-Rust web UI: login-protected receiver management"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "time"] }
sdrtrunk-p25 = { path = "../sdrtrunk-p25" }
sdrtrunk-source = { path = "../sdrtrunk-source" }
axum = { version = "0.8", features = ["multipart"] }
maud = { version = "0.27", features = ["axum"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
futures-core = "0.3"
sdrtrunk-audio = { path = "../sdrtrunk-audio" }
sdrtrunk-dsp = { path = "../sdrtrunk-dsp" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_urlencoded = "0.7"
# Reads sdrtrunk playlists (default.xml) for the stream import; small, no dependencies of its own.
roxmltree = "0.20"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
